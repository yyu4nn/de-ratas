<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escucha "DE RATAS" en Youtube</title>
  
  <!-- Miniatura y título al compartir el enlace -->
  <meta property="og:title" content="ESTADO ERRATIKO - DE RATAS" />
  <meta property="og:image" content="https://img.youtube.com/vi/9OPK8zkexWs/maxresdefault.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    // ID limpio de tu video de YouTube
    const videoId = "9OPK8zkexWs"; 
    
    const webUrl = "https://www.youtube.com/watch?v=" + videoId;
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.replace(
        "intent://www.youtube.com/watch?v=" + videoId + 
        "#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=" + 
        encodeURIComponent(webUrl) + ";end"
      );
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.href = "vnd.youtube://www.youtube.com/watch?v=" + videoId;
      setTimeout(function() {
        window.location.replace(webUrl);
      }, 1500);
    } else {
      window.location.replace(webUrl);
    }
  </script>
</head>
<body style="background:#0f0f0f; color:#fff; font-family:sans-serif; text-align:center; padding-top:40vh;">
  <p>Abriendo en la app de YouTube...</p>
</body>
</html>
